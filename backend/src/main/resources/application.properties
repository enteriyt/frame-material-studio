spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studio?serverTimezone=UTC}
spring.datasource.username=${DB_USER:studio}
spring.datasource.password=${DB_PASSWORD:studio-local}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
studio.storage=${STORAGE_DIR:./data}
studio.allowed-origin=${ALLOWED_ORIGIN:http://localhost:3000}
studio.simulation-enabled=${SIMULATION_ENABLED:true}

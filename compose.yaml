services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: studio
      MYSQL_USER: studio
      MYSQL_PASSWORD: studio-local
      MYSQL_ROOT_PASSWORD: root-local
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysql, -h, 127.0.0.1, -ustudio, -pstudio-local, studio, -e, "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/studio?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USER: studio
      DB_PASSWORD: studio-local
      STORAGE_DIR: /data
    volumes:
      - assets:/data
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/api/health]
      interval: 5s
      timeout: 3s
      retries: 30
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mysql-data:
  assets:
